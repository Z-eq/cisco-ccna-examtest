<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title id="pageTitle">CCNA - By Z</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="light">
<div class="container my-5">

    <div class="text-center mb-4 position-relative">
        <div class="header-controls d-flex gap-3 position-absolute top-0 end-0 me-3 mt-3">
            <button id="languageToggle" class="btn btn-sm btn-primary"></button>
            <button id="themeToggle" class="btn btn-sm btn-secondary">🌓 Byt Tema</button>
        </div>
        <h1 id="mainTitle">🖧 CCNA Test - 200-301 v2.1</h1>
        <div id="infoAlert" class="alert alert-info mt-3"></div>
    </div>

    <div id="startScreen" class="quiz-container">
        <div class="start-grid">
            <div class="card control-group">
                <div class="card-header"><h4 id="card1Header">1. Välj Frågekällor</h4></div>
                <div class="card-body">
                    <div id="fileCheckboxes" class="checkbox-area"></div>
                    <div class="mt-3 d-flex justify-content-between align-items-center">
                        <button id="toggleFilesBtn" class="btn btn-sm btn-outline-secondary">Avmarkera alla</button>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="onlyWrong">
                            <label class="form-check-label" for="onlyWrong" id="checkboxLabelWrong">🚩 Endast felsvarade</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card control-group">
                <div class="card-header"><h4 id="card2Header">2. Filtrera efter Kategori</h4></div>
                <div class="card-body">
                    <button id="loadCategoriesBtn" class="btn btn-info w-100 mb-3">📂 Ladda frågor & Välj Kategorier</button>
                    <div id="categorySelection" class="p-3 border rounded d-none">
                        <h5 id="categoriesAvailable">Tillgängliga Kategorier:</h5>
                        <div id="categoryCheckboxes" class="checkbox-area categories-grid"></div>
                        <button id="toggleCategoriesBtn" class="btn btn-sm btn-outline-secondary mt-2">Avmarkera alla</button>
                    </div>
                </div>
            </div>

            <div class="card control-group full-width-card">
                <div class="card-header"><h4 id="card3Header">3. Inställningar & Start</h4></div>
                <div class="card-body">
                    <div class="mb-3 d-flex align-items-center">
                        <label for="numQuestions" class="form-label me-3 mb-0" id="labelNumQuestions">Antal frågor:</label>
                        <input type="number" id="numQuestions" class="form-control w-25" value="" min="1">
                    </div>
                    <button id="startBtn" class="btn btn-primary btn-lg w-100 mt-3" disabled>▶ STARTA QUIZ</button>
                    
                    <hr class="mt-4 mb-4">
                    
                    <button id="showHighscoresBtn" class="btn btn-outline-secondary w-100 mb-2">🏆 Visa highscores</button>
                    <div id="highscoresDiv" class="mt-2 p-3 border rounded highscores-area" style="display: none;"></div>

                    <button id="showTagsBtn" class="btn btn-outline-warning w-100">🔖 Visa taggade frågor</button>
                    <div id="tagsDiv" class="mt-2 p-3 border rounded tags-area" style="display: none;">
                        <div id="tagsContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="quizScreen" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <button id="tagBtn" class="btn btn-outline-warning">🔖 Tagga för senare</button>
            <button id="abortBtn" class="btn btn-danger">⏹ Avbryt quiz</button>
        </div>
        <div class="progress mb-3">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%">0%</div>
        </div>
        <div class="card mb-3">
            <div class="card-body">
                <h4 id="questionNum" class="text-dark"></h4>
                <p id="questionText" class="text-dark"></p>
                <div id="options"></div>
                <div id="explanation" class="explanation d-none"></div>
                <button id="multiSubmitBtn" class="btn btn-primary mt-3 d-none"></button>
                <button id="nextBtn" class="btn btn-success mt-3 d-none"></button>
            </div>
        </div>
    </div>

    <div id="resultScreen" class="d-none text-center">
        <h2 id="resultTitle" class="mb-4">📊 Resultat</h2>
        <div class="chart-container shadow-sm p-3 mb-4 bg-white rounded mx-auto" style="position: relative; height:350px; width:100%; max-width: 800px;">
            <canvas id="categoryChart"></canvas>
        </div>
        <div id="totalResult" class="mt-3"></div>
        <div id="deepDiveContainer" class="mt-5 text-start mx-auto" style="max-width: 800px;"></div>
        <button id="restartBtn" class="btn btn-primary btn-lg mt-5 mb-5 px-5">🔁 Starta om</button>
    </div>

</div>

<div class="modal fade" id="abortModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="abortModalTitle">Avbryt quiz?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="abortModalBody">Vill du rätta befintliga svar eller återgå?</div>
            <div class="modal-footer">
                <button type="button" id="abortWithScore" class="btn btn-primary" data-bs-dismiss="modal">Rätta</button>
                <button type="button" id="abortWithoutScore" class="btn btn-secondary" data-bs-dismiss="modal">Avbryt helt</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="tagModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tagModalTitle">Tagga Fråga</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong id="tagQuestionLabel">Fråga:</strong> <span id="tagQuestionText"></span></p>
                <div class="mb-3">
                    <label for="tagCommentTextarea" class="form-label" id="tagCommentLabel">Anteckning:</label>
                    <textarea class="form-control" id="tagCommentTextarea" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="tagCancelBtn" class="btn btn-secondary" data-bs-dismiss="modal">Avbryt</button>
                <button type="button" id="confirmTagBtn" class="btn btn-warning">Spara Tagg</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/darkmode.js"></script>
<script src="/static/quiz.js"></script>
</body>
</html>
